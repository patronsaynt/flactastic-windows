[package]
name = "flactastic"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "FLACtastic for Windows and Linux"
default-run = "flactastic"

[lib]
name = "flactastic_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fl-core = { path = "../../crates/fl-core" }
fl-tags = { path = "../../crates/fl-tags" }
fl-audio = { path = "../../crates/fl-audio" }
fl-library = { path = "../../crates/fl-library" }
fl-platform = { path = "../../crates/fl-platform" }
fl-net = { path = "../../crates/fl-net" }
fl-sync = { path = "../../crates/fl-sync" }
mdns-sd = "0.13"
openssl = { version = "0.10", features = ["vendored"] }
tokio = { version = "1", features = ["sync", "net", "time", "rt", "macros"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
log.workspace = true
parking_lot = "0.12"
indexmap.workspace = true
crossbeam-channel = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
env_logger = "0.11"
chrono.workspace = true
fastrand.workspace = true
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }

[dev-dependencies]
tempfile.workspace = true
