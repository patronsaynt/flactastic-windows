[package]
name = "fl-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Gapless playback engine: symphonia decode, libsoxr VHQ resampling, WASAPI/PipeWire/ALSA output"
links = "soxr"

[dependencies]
fl-core = { path = "../fl-core" }
log.workspace = true
thiserror.workspace = true
serde.workspace = true
parking_lot = "0.12"
rtrb = "0.3"
realfft = "3"
symphonia = { version = "0.5.5", default-features = false, features = ["flac", "mp3", "aac", "alac", "isomp4", "wav", "aiff", "pcm"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Security",
] }
windows-core = "0.61"

[build-dependencies]
cmake = "0.1"

[dev-dependencies]
flacenc = "0.5"
tempfile.workspace = true
