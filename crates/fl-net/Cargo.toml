[package]
name = "fl-net"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "FLACtastic web clients: Deezer, lrclib, Odesli, Spotify, Discord IPC"

[dependencies]
fl-core = { path = "../fl-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
ureq = { version = "3", features = ["json"] }
parking_lot = "0.12"
base64.workspace = true
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO"] }
