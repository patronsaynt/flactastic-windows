name: CI

# Tests and lint on Windows and Linux. Idle until the repository is hosted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libasound2-dev libdbus-1-dev libssl-dev patchelf cmake nasm ffmpeg

      - name: NASM (vendored OpenSSL)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: ffmpeg (gapless test fixtures)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: UI dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: UI typecheck
        run: pnpm --dir ui typecheck

      - name: UI tests
        run: pnpm --dir ui test

      # The app crate embeds ui/dist.
      - name: UI build
        run: pnpm --dir ui build

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets
